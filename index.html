<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>森森文創｜貼紙費用試算</title>
<style>
body{margin:0;background:#f7f3f0;color:#403936;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
.box{max-width:520px;margin:auto;padding:20px}
.card{background:white;border-radius:20px;padding:20px;margin-bottom:15px;box-shadow:0 4px 15px #0001}
h1{margin:0 0 6px;font-size:23px}
p{color:#888;font-size:13px}
label{display:block;font-weight:bold;margin:18px 0 8px}
select,input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;box-sizing:border-box;background:white}
.options{display:flex;gap:7px}
.options label{flex:1;border:1px solid #ddd;border-radius:12px;padding:13px 4px;text-align:center;font-size:13px;margin:0}
.options input{display:none}
.options label:has(input:checked){border:2px solid #b96f78;background:#fff3f4;color:#9c4f59}
.result{text-align:center;background:#fff7ef}
.price{font-size:40px;font-weight:bold;margin:10px}
.detail{font-size:13px;line-height:1.8;color:#777}
.note{font-size:12px;color:#999;line-height:1.7;margin-top:12px}
button{width:100%;border:0;border-radius:12px;padding:15px;background:#b96f78;color:white;font-size:16px;font-weight:bold}
</style>
</head>

<body>
<div class="box">

<div class="card">
<h1>🌿 森森文創｜貼紙費用試算</h1>
<p>選擇尺寸、數量與製作方式，即時查看預估價格</p>

<label>① 選擇貼紙尺寸</label>
<select id="size">
<option value="2x2">2 × 2 cm</option>
<option value="2x2.5">2 × 2.5 cm</option>
<option value="3x2">3 × 2 cm</option>
<option value="3x1.3">3 × 1.3 cm</option>
<option value="2.5x2.5">2.5 × 2.5 cm</option>
<option value="3x3">3 × 3 cm</option>
<option value="4x4">4 × 4 cm</option>
<option value="5x5">5 × 5 cm</option>
<option value="6x6">6 × 6 cm</option>
<option value="7x7">7 × 7 cm</option>
<option value="8x8">8 × 8 cm</option>
<option value="9x9">9 × 9 cm</option>
<option value="10x10">10 × 10 cm</option>
</select>

<label>② 數量</label>
<input id="qty" type="number" min="1" value="100">

<label>③ 製作方式</label>
<div class="options">
<label><input type="radio" name="type" value="normal" checked>一般</label>
<label><input type="radio" name="type" value="special">特殊形狀</label>
<label><input type="radio" name="type" value="design">設計／開版<br>＋$100</label>
</div>
</div>

<div class="card result">
<div>預估總金額</div>
<div class="price" id="price">$0</div>
<div class="detail" id="detail"></div>
<div class="note">
※ 價格已包含基本包裝費 $6<br>
※ 特殊形狀實際依圖案複雜度確認<br>
※ 設計／開版費 $100<br>
※ 實際報價以確認稿件後為準
</div>
</div>

<div class="card">
<button onclick="order()">我要訂購</button>
</div>

</div>

<script>
const capacity={
"2x2":70,
"2x2.5":60,
"3x2":52,
"3x1.3":60,
"2.5x2.5":40,
"3x3":32,
"4x4":23,
"5x5":14,
"6x6":11,
"7x7":6,
"8x8":6,
"9x9":4,
"10x10":2
};

const A4_COST=14.365;
const PACKAGING=6;
const MARGIN=0.40;

function calculate(){

const size=document.getElementById("size").value;
const qty=Math.max(1,parseInt(document.getElementById("qty").value)||1);
const type=document.querySelector('input[name="type"]:checked').value;

const sheets=Math.ceil(qty/capacity[size]);

let price=Math.ceil(
((sheets*A4_COST+PACKAGING)/(1-MARGIN))/10
)*10;

if(type==="design"){
price+=100;
}

document.getElementById("price").innerText=
"$"+price.toLocaleString();

let text=size.replace("x"," × ")+" cm｜"+
qty.toLocaleString()+" 張<br>基本包裝已包含";

if(type==="special"){
text+="<br>特殊形狀：實際依圖案複雜度確認";
}

if(type==="design"){
text+="<br>已包含設計／開版費 $100";
}

document.getElementById("detail").innerHTML=text;
}

function order(){
alert(
"試算結果\n\n"+
"尺寸："+document.getElementById("size").value.replace("x"," × ")+" cm\n"+
"數量："+(parseInt(document.getElementById("qty").value)||1)+" 張\n"+
"預估金額："+document.getElementById("price").innerText+
"\n\n請截圖此畫面，再私訊森森文創詢價／下單。"
);
}

document.getElementById("size").addEventListener("change",calculate);
document.getElementById("qty").addEventListener("input",calculate);

document.querySelectorAll('input[name="type"]').forEach(function(x){
x.addEventListener("change",calculate);
});

calculate();
</script>

</body>
</html>
